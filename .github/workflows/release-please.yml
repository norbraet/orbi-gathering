name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # target-branch must stay pinned to main: release-please otherwise
      # defaults to the repository's default branch, which is develop in
      # this template's branching model, and main is the only branch this
      # workflow should ever release from.
      # Use a fine-grained PAT stored as RELEASE_PLEASE_TOKEN so the release
      # PR triggers CI and PR-title workflows automatically. Its repository
      # permissions must include Contents, Issues, and Pull requests: read and
      # write. See README.md.
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: main
